<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autores</title>
</head>
<body>
<h1>Autores registrados</h1>
<a th:href="@{/autores/novo}">Adicionar autor</a>

<table border="1">
    <thead>
    <tr>
        <th>Nome</th>
        <th>Nacionalidade</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="autor, contador : ${autores}">
        <td th:text="${autor.nome}"></td>
        <td th:text="${autor.nacionalidade}"></td>
        <td>
            <a th:href="@{/autores/excluir/{posicao}(posicao=${contador.index})}">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
